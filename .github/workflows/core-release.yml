# Publishes grade-checker-core (applications/library-core) to GitHub Packages (capability core-artifact): tag core-vX.Y.Z, GitHub Release
# and the jars. Manual trigger only: Actions > "Release core library" > Run workflow (branch main), or
#   gh workflow run core-release.yml --ref main -f version=1.0.0
# The version must be the one in applications/library-core/pom.xml. A published version never changes: a fix is a new patch version
# (see applications/library-core/CHANGELOG.md).
name: Release core library

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z), equal to applications/library-core/pom.xml. Creates the tag core-vX.Y.Z."
        required: true
        type: string

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: applications/library-core

concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
    # first: the default working-directory (defaults.run) exists only after the checkout
    - uses: actions/checkout@v4

    - name: Check branch and version
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::run this workflow from main (got $GITHUB_REF)"; exit 1
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must be X.Y.Z (got '$VERSION')"; exit 1
        fi
        echo "TAG=core-v$VERSION" >> "$GITHUB_ENV"

    - name: Tag must not exist
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
          echo "::error::tag $TAG already exists; a published version never changes"; exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Version must be the one in pom.xml
      run: |
        POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
        echo "pom version: $POM_VERSION, requested: $VERSION"
        if [ "$POM_VERSION" != "$VERSION" ]; then
          echo "::error::version $VERSION does not match applications/library-core/pom.xml ($POM_VERSION)"; exit 1
        fi

    - name: Test
      run: mvn -B verify

    - name: Publish to GitHub Packages
      run: mvn -B deploy -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create tag and release with the jars
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$TAG" target/grade-checker-core-"$VERSION".jar target/grade-checker-core-"$VERSION"-sources.jar \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes "grade-checker-core $VERSION, published to GitHub Packages. See applications/library-core/CHANGELOG.md." \
          --latest=false
