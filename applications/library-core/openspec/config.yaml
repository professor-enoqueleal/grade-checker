schema: spec-driven

# OpenSpec da library grade-checker-core (pasta applications/library-core), separado do OpenSpec do monolith
# (openspec/ na raiz) e do da versão serverless (applications/serverless/openspec). Rode os comandos a partir de
# applications/library-core.
context: |
  grade-checker-core: library Maven (Java 11) com o domínio do Grade Checker (notas por marco, atribuição de autores,
  períodos, grupos e membros) e o cliente do GitHub, publicada no GitHub Packages e usada pelo monolith
  (applications/monolith, versão Jetty) e pela versão serverless (applications/serverless/lambda). Análise e plano: plan.md.
  Pacotes: br.com.gradechecker.core.*. Specs e documentação em português; código e mensagens em inglês.

rules:
  tasks:
    - Marcar cada tarefa assim que o código dela estiver feito e testado
