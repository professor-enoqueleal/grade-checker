# grading.properties - nota de contribuição por marco (openspec capability milestone-grading)
#
# Nota do marco = maxPoints x min(1, (participação no índice / parte justa) / tolerance)
#   parte justa = 1 / número de alunos do grupo
#   participação no índice = soma dos pesos x (indicador do aluno / soma do indicador no grupo)
# Alterações exigem reiniciar a aplicação. Valores inválidos voltam ao padrão (aviso no log).

grading.milestone.maxPoints=3
grading.tolerance=0.8

# pesos dos indicadores (normalizados para somar 1)
grading.weight.effectiveLines=0.5
grading.weight.activeDays=0.3
grading.weight.relevantCommits=0.2

# linhas efetivas: teto por commit (adições + remoções)
grading.commit.lineCap=400

# reorganização (mover/renomear arquivos): arquivos >= minFiles e min(adições, remoções) >= balance x max(...)
# conta "factor" das linhas
grading.reorganization.minFiles=30
grading.reorganization.balance=0.6
grading.reorganization.factor=0.1

# commit relevante: linhas >= minLines
grading.relevantCommit.minLines=20

# logins do GitHub que não são alunos (professor, monitores), separados por vírgula; bots ([bot]) já são ignorados
grading.excludedLogins=professor-enoqueleal
