# Local stand-in for CloudFront (capability local-compose): same origin for the SPA and /api.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # API: the local HTTP API gateway (which invokes the Lambda)
    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
    }

    # built files only: a missing asset is a 404, never index.html
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routes (/home, /detail, /grades...): index.html, like the CloudFront Function in production
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
