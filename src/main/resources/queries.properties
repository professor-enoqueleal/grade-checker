# queries.properties - all SQL used by the repositories (openspec capability: sql-queries)
#
# Convention: <domain>.<action>=<SQL>
# Every key must be valid SQL against the schema in db.sql (checked by QueriesTest).
# Dynamic IN lists use %s, which the repository fills ONLY with "?" placeholders.

# members
member.insert=INSERT INTO MEMBERS (NAME, GITHUB_USERNAME, GROUP_ID, GITHUB_ID, CREATED_MANUALLY, CONTRIBUTIONS) VALUES (?, ?, ?, ?, ?, ?)
member.countByGroupId=SELECT COUNT(*) AS TOTAL FROM MEMBERS WHERE GROUP_ID = ?
member.countByGroupIdAndUsername=SELECT COUNT(*) AS CNT FROM MEMBERS WHERE GROUP_ID = ? AND GITHUB_USERNAME = ?
member.selectUsernamesByGroupIdAndUsernames=SELECT GITHUB_USERNAME FROM MEMBERS WHERE GROUP_ID = ? AND GITHUB_USERNAME IN (%s)
member.updateGithubIdAndContributions=UPDATE MEMBERS SET GITHUB_ID = ?, CONTRIBUTIONS = ? WHERE GROUP_ID = ? AND GITHUB_USERNAME = ? AND (GITHUB_ID IS NULL OR CREATED_MANUALLY = TRUE)

# groups
group.insert=INSERT INTO GROUPS (NAME, REPOSITORY_URL, REPOSITORY_OWNER, REPOSITORY_NAME) VALUES (?, ?, ?, ?)
group.findById=SELECT * FROM GROUPS WHERE ID = ?
group.findAll=SELECT * FROM GROUPS

# contributors
contributors.findByGroupId=SELECT * FROM CONTRIBUTORS WHERE GROUP_ID = ?
contributors.insert=INSERT INTO CONTRIBUTORS (ID, LOGIN, AVATAR_URL, HTML_URL, CONTRIBUTIONS, GROUP_ID) VALUES (?, ?, ?, ?, ?, ?)
contributors.existsById=SELECT 1 FROM CONTRIBUTORS WHERE ID = ?
