# queries.properties - all SQL used by the repositories (openspec capability: sql-queries)
#
# Convention: <domain>.<action>=<SQL>
# Every key must be valid SQL against the schema in db.sql (checked by QueriesTest).
# Dynamic IN lists (none today) use %s, which the repository fills ONLY with "?" placeholders.

# members (openspec capability group-members)
member.insert=INSERT INTO MEMBERS (NAME, GITHUB_USERNAME, GROUP_ID, GITHUB_ID, CREATED_MANUALLY, CONTRIBUTIONS) VALUES (?, ?, ?, NULL, ?, 0)
member.countByGroupId=SELECT COUNT(*) AS TOTAL FROM MEMBERS WHERE GROUP_ID = ?
member.selectUsernamesByGroupId=SELECT GITHUB_USERNAME FROM MEMBERS WHERE GROUP_ID = ? ORDER BY GITHUB_USERNAME
member.findByGroupId=SELECT GITHUB_USERNAME, NAME FROM MEMBERS WHERE GROUP_ID = ? ORDER BY LOWER(GITHUB_USERNAME)
member.countByGroupIdAndUsername=SELECT COUNT(*) AS CNT FROM MEMBERS WHERE GROUP_ID = ? AND LOWER(GITHUB_USERNAME) = LOWER(?)
member.delete=DELETE FROM MEMBERS WHERE GROUP_ID = ? AND LOWER(GITHUB_USERNAME) = LOWER(?)
member.update=UPDATE MEMBERS SET GITHUB_USERNAME = ?, NAME = ? WHERE GROUP_ID = ? AND LOWER(GITHUB_USERNAME) = LOWER(?)

# groups
group.insert=INSERT INTO GROUPS (NAME, REPOSITORY_URL, REPOSITORY_OWNER, REPOSITORY_NAME) VALUES (?, ?, ?, ?)
group.findById=SELECT * FROM GROUPS WHERE ID = ?
group.findAll=SELECT * FROM GROUPS

# identity aliases (openspec capability identity-aliases)
alias.findByGroupId=SELECT IDENTITY_KEY, LOGIN FROM IDENTITY_ALIASES WHERE GROUP_ID = ? ORDER BY IDENTITY_KEY
alias.save=MERGE INTO IDENTITY_ALIASES (GROUP_ID, IDENTITY_KEY, LOGIN, CREATED_BY) KEY (GROUP_ID, IDENTITY_KEY) VALUES (?, ?, ?, ?)
alias.delete=DELETE FROM IDENTITY_ALIASES WHERE GROUP_ID = ? AND IDENTITY_KEY = ?
alias.existsByLogin=SELECT COUNT(*) AS CNT FROM IDENTITY_ALIASES WHERE GROUP_ID = ? AND LOWER(LOGIN) = LOWER(?)
alias.updateLogin=UPDATE IDENTITY_ALIASES SET LOGIN = ? WHERE GROUP_ID = ? AND LOWER(LOGIN) = LOWER(?)
